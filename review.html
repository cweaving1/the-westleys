<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Julia &amp; Aidan · Site review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Cormorant+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#3A4558;--muted:#5E6B80;--navy:#2D3A52;--tint:#EEF1F5;--rule:#CBD3DC;--stage:#E4E8EE}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--stage);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;display:flex;flex-direction:column}
header{background:#F7F5EF;border-bottom:1px solid var(--rule);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
h1{margin:0;font:600 22px/1.1 'Cormorant SC',serif;letter-spacing:.12em;margin-right:auto;color:var(--navy)}
h1 small{display:block;font:500 14px/1.3 'Cormorant Garamond',serif;letter-spacing:.02em;color:var(--muted);margin-top:3px}
nav,.seg{display:flex;gap:6px;flex-wrap:wrap}
button{font:600 13px/1 'Cormorant SC',serif;letter-spacing:.14em;min-height:40px;padding:0 16px;border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
button[aria-pressed="true"]{background:var(--navy);color:#fff}
button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
main{flex:1;overflow:auto;padding:24px 16px 48px}
.frame{margin:0 auto;background:#fff;box-shadow:0 10px 40px rgba(30,40,60,.18);overflow:hidden;position:relative}
.frame iframe{border:0;display:block;transform-origin:0 0}
.phone{width:390px;max-width:100%;border-radius:28px;border:10px solid #22293A}
.phone iframe{width:100%;height:calc(100vh - 190px);min-height:560px}
.note{max-width:1440px;margin:0 auto 12px;font-size:16px;color:var(--muted)}
.note.warn{color:#8E3B3B}
@media (max-width:760px){header{padding:10px 16px}h1{width:100%}button{padding:0 10px;font-size:14px;letter-spacing:.04em}main{padding:12px 0 24px}.phone{border:0;border-radius:0;width:100%}.phone iframe{height:calc(100vh - 150px)}.note{padding:0 16px}}
.rv-tools{display:flex;gap:6px;flex-wrap:wrap}
#rv-mode[aria-pressed="true"]{background:var(--navy);color:#fff}
.rv-badge{display:inline-block;min-width:20px;height:20px;line-height:20px;border-radius:10px;background:var(--navy);color:#fff;font-size:12px;letter-spacing:0;margin-left:6px;padding:0 5px;text-align:center}
.rv-badge[hidden]{display:none}
button[aria-pressed="true"] .rv-badge{background:#fff;color:var(--navy)}
#rv-panel{position:fixed;right:0;top:0;bottom:0;width:400px;max-width:100%;background:#fff;border-left:1px solid var(--rule);box-shadow:-8px 0 30px rgba(30,40,60,.15);z-index:20;display:flex;flex-direction:column}
#rv-panel[hidden]{display:none}
.rv-head{padding:14px 16px;border-bottom:1px solid var(--rule);background:var(--tint)}
.rv-head h2{margin:0;font:600 20px/1.15 'Cormorant SC',serif;letter-spacing:.1em;padding-right:64px;color:var(--navy)}
.rv-head p{margin:6px 0 10px;font-size:16px}
.rv-head .rv-row{display:flex;flex-wrap:wrap;gap:6px}
.rv-head button,#rv-dialog button{font-size:13px;letter-spacing:.06em;min-height:40px;padding:0 12px}
.linkish{border:0!important;background:none!important;color:var(--navy)!important;text-decoration:underline;padding:0 4px!important;min-height:0!important}
#rv-close{position:absolute;right:12px;top:12px}
#rv-list{flex:1;overflow:auto;padding:0 16px 24px}
#rv-dialog{border:0;padding:24px;width:min(480px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.3);font-family:'Cormorant Garamond',Georgia,serif;color:var(--ink)}
#rv-dialog::backdrop{background:rgba(30,40,60,.35)}
#rv-dialog h2{margin:0 0 4px;font:600 22px/1.2 'Cormorant SC',serif;letter-spacing:.08em;color:var(--navy)}
#rv-dialog .rv-primary{background:var(--navy);border-color:var(--navy);color:#fff}
@media (max-width:760px){#rv-panel{top:auto;height:75vh;width:100%;border-left:0;border-top:1px solid var(--rule)}.rv-head button,#rv-dialog button{min-height:44px;font-size:14px}}
</style>
</head>
<body>
<header>
<h1>Julia &amp; Aidan <small>the-westleys.com · site review</small></h1>
<nav aria-label="Page">
<button type="button" data-page="Home">Home</button>
<button type="button" data-page="Weekend">The Weekend</button>
<button type="button" data-page="Travel">Travel &amp; Stay</button>
<button type="button" data-page="RSVP">RSVP</button>
<button type="button" data-page="Registry">Registry</button>
<button type="button" data-page="FAQ">Good to Know</button>
<button type="button" data-page="Guestbook">Guestbook</button>
<button type="button" data-page="Portal">RSVP portal</button>
</nav>
<div class="seg" role="group" aria-label="Device">
<button type="button" data-view="desktop">Desktop</button>
<button type="button" data-view="phone">Phone</button>
</div>
<div class="rv-tools">
<button type="button" id="rv-mode" aria-pressed="false">Comment</button>
<button type="button" id="rv-panel-btn" aria-expanded="false" aria-controls="rv-panel">Comments <span id="rv-count"></span></button>
</div>
</header>
<main>
<p class="note" id="note"></p>
<div class="frame" id="frame"><iframe id="view" title="Site preview"></iframe></div>
</main>
<aside id="rv-panel" aria-labelledby="rv-title" hidden>
<div class="rv-head" style="position:relative">
<h2 id="rv-title">Comments</h2>
<button type="button" id="rv-close">Close</button>
<p>Commenting as <strong data-rv-me>not set</strong> <button type="button" id="rv-name-change" class="linkish">Change name</button></p>
<div class="rv-row"><button type="button" id="rv-general">Comment on the whole page</button><button type="button" id="rv-showres">Show resolved</button></div>
</div>
<div id="rv-list" aria-live="polite"></div>
</aside>
<dialog id="rv-dialog" aria-labelledby="rv-dlg-title">
<h2 id="rv-dlg-title">Comment on this spot</h2>
<form class="rv-form">
<label>Your name <input type="text" name="author" required maxlength="80" autocomplete="name"></label>
<label>Comment <textarea name="body" required maxlength="4000"></textarea></label>
<div class="rv-row"><button class="rv-btn rv-primary" type="submit">Post comment</button><button class="rv-btn" type="button" data-rv-cancel>Cancel</button></div>
<p class="rv-err" role="alert"></p>
</form>
</dialog>
<script>
/* The review key arrives once in the link (?k=…), is kept on this device, and is dropped from the address bar,
   so it never lives in this public repo. */
(function(){
  var CODE_KEY='mohi-review-code-westleys', q=new URLSearchParams(location.search), k=q.get('k');
  try{ if(k){ localStorage.setItem(CODE_KEY,k); q.delete('k'); history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash); } window.__rvHasKey=!!localStorage.getItem(CODE_KEY); }catch(e){ window.__rvHasKey=false; }
})();
(function(){
  var NAMES={Home:'Home',Weekend:'The Weekend',Travel:'Travel & Stay',RSVP:'RSVP',Registry:'Registry',FAQ:'Good to Know',Guestbook:'Guestbook',Portal:'RSVP portal'};
  var SRC={Home:'index.html?review=1#home',Weekend:'index.html?review=1#weekend',Travel:'index.html?review=1#travel',RSVP:'index.html?review=1#rsvp',
    Registry:'index.html?review=1#registry',FAQ:'index.html?review=1#faq',Guestbook:'index.html?review=1#guestbook',Portal:'admin.html'};
  var frame=document.getElementById('frame'), ifr=document.getElementById('view'), note=document.getElementById('note');
  var page='Home', view=innerWidth<760?'phone':'desktop';
  function fromHash(){var h=location.hash.replace('#','');if(NAMES[h])page=h;}
  function fit(){
    if(view!=='desktop')return;
    var w=frame.parentElement.clientWidth-32, s=Math.min(1,w/1440);
    frame.style.width=(1440*s)+'px';
    var h=(innerHeight-170)/s;
    ifr.style.width='1440px'; ifr.style.height=h+'px'; ifr.style.transform='scale('+s+')';
    frame.style.height=(h*s)+'px';
  }
  function render(){
    document.querySelectorAll('[data-page]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.page===page)});
    document.querySelectorAll('[data-view]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.view===view)});
    frame.className='frame'+(view==='phone'?' phone':'');
    ifr.removeAttribute('style'); frame.removeAttribute('style');
    if(ifr.getAttribute('src')!==SRC[page]) ifr.setAttribute('src',SRC[page]);
    ifr.title=NAMES[page]+' · '+view;
    if(!window.__rvHasKey){ note.className='note warn'; note.textContent='Open this page from the review link Christa sent you to see and leave comments.'; }
    else { note.className='note'; note.textContent=NAMES[page]+' · '+(view==='desktop'?'1440 px desktop, scaled to fit.':'390 px phone.')+' Scroll inside the frame. Click Comment, then click anywhere on the page to leave a note, or use Comments → Comment on the whole page.'+(page==='Portal'?' The portal needs your admin key to show data.':''); }
    fit();
    window.MOHI={page:page,view:view,name:NAMES[page],ifr:ifr,setView:function(v){view=v;render()}};
    dispatchEvent(new Event('mohi:render'));
  }
  document.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){page=b.dataset.page;history.replaceState(null,'','#'+page);render()}});
  document.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){view=b.dataset.view;render()}});
  addEventListener('hashchange',function(){fromHash();render()});
  addEventListener('resize',fit);
  fromHash(); render();
})();
</script>
<script>window.MOHI_REVIEW={board:'westleys',mode:'pins'};</script>
<script src="review.js"></script>
</body>
</html>
